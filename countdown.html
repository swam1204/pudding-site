<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown to Our Date</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@500&display=swap');

    body {
      background: linear-gradient(to bottom right, #ffeef8, #fff0f5);
      font-family: 'Quicksand', sans-serif;
      text-align: center;
      padding-top: 12vh;
      color: #d63384;
    }

    h1 {
      font-family: 'Cherry Bomb One', cursive;
      font-size: 26px;
    }

    #timer {
      font-size: 36px;
      margin-top: 20px;
      font-family: 'Cherry Bomb One', cursive;
    }

    p {
      font-size: 18px;
      margin-top: 20px;
    }

    .gif {
      width: 200px;
      margin: 20px auto;
      border-radius: 20px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Can't wait for our date at your home!</h1>
  <div id="timer">Loading...</div>
  <p>Our date at your home is getting closer!</p>
  <p>See you soon!</p>

  <script>
    const countdownDate = new Date("April 10, 2025 19:00:00").getTime();

    const timerInterval = setInterval(() => {
      const now = new Date().getTime();
      const distance = countdownDate - now;

      if (distance < 0) {
        clearInterval(timerInterval);
        document.getElementById("timer").innerHTML = "It's time! 💖";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);
  </script>
</body>
</html>
