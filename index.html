<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Pudding</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@500&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: #fff0f5;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ffc0cb;
      border-radius: 5px;
    }

    button {
      margin-top: 10px;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      font-family: 'Cherry Bomb One', cursive;
    }

    .container, .surprise {
      display: none;
    }

    .fade {
      opacity: 0;
      transition: opacity 1.5s ease-in;
    }

    .fade.show {
      opacity: 1;
    }

    .surprise {
      background: linear-gradient(to top right, #fff0f5, #ffe4e1);
      width: 100vw;
      height: 100vh;
      z-index: 999;
      text-align: center;
      padding-top: 15vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    .gif {
      width: 180px;
      margin: 20px auto;
      display: block;
    }

    #countdownBtn {
      display: none;
      margin-top: 20px;
    }

    h1 {
      font-family: 'Cherry Bomb One', cursive;
      color: #d63384;
    }

    p.note {
      font-size: 14px;
      color: #d63384;
      font-style: italic;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="entry">
    <h2 style="font-family: 'Cherry Bomb One', cursive;">Enter the Secret Code</h2>
    <input type="password" id="code" placeholder="Enter password" />
    <br />
    <button onclick="checkPassword()">Enter</button>
  </div>

  <div class="container" id="messageSection">
    <h1 id="msg" class="fade">Hello My Pudding, do you want me to come over your home after work?</h1>
    <button id="yesBtn" class="fade" onclick="showSurprise()">Yes</button>
    <p id="noMsg" class="fade note">
      What are you waiting for...<br>Just click Yes!!!<br>
      <img class="gif" src="https://media.tenor.com/Sf0DbPbGVxUAAAAi/cat-smacking-other-cat-cat.gif" alt="Cat smacking other cat gif" />
    </p>
  </div>

  <div class="surprise" id="surprise">
    <h1>I knew you would say yes 💖<br>I knew you missed me already</h1>
    <img class="gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cat hugging gif" />
    <button id="countdownBtn" onclick="location.href='countdown.html'">See Countdown</button>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('code').value.trim();
      if (input === '1014') {
        document.querySelector('.entry').style.display = 'none';
        document.getElementById('messageSection').style.display = 'block';
        setTimeout(() => document.getElementById('msg').classList.add('show'), 100);
        setTimeout(() => document.getElementById('yesBtn').classList.add('show'), 1000);
        setTimeout(() => document.getElementById('noMsg').classList.add('show'), 2000);
      } else {
        alert("Oops! That's not the right code.");
      }
    }

    function showSurprise() {
      document.getElementById('messageSection').style.display = 'none';
      document.getElementById('surprise').style.display = 'block';
      setTimeout(() => {
        document.getElementById('countdownBtn').style.display = 'inline-block';
      }, 1000);
    }
  </script>
</body>
</html>
