<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Pudding</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@500&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: #fff0f5;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    .floating-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: -1;
    }

    .floating-bg span {
      position: absolute;
      font-size: 24px;
      opacity: 0.6;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ffc0cb;
      border-radius: 5px;
    }

    button {
      margin-top: 10px;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      font-family: 'Cherry Bomb One', cursive;
    }

    .container, .surprise {
      display: none;
    }

    .fade {
      opacity: 0;
      transition: opacity 1.5s ease-in;
    }

    .fade.show {
      opacity: 1;
    }

    .surprise {
      background: linear-gradient(to top right, #fff0f5, #ffe4e1);
      width: 100vw;
      height: 100vh;
      z-index: 999;
      text-align: center;
      padding-top: 15vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    .gif {
      width: 180px;
      margin: 20px auto;
      display: block;
    }

    #countdownBtn {
      display: none;
      margin-top: 20px;
    }

    h1 {
      font-family: 'Cherry Bomb One', cursive;
      color: #d63384;
    }

    p.note {
      font-size: 14px;
      color: #d63384;
      font-style: italic;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="floating-bg" id="floatingBg"></div>

  <div class="entry">
    <h2 style="font-family: 'Cherry Bomb One', cursive;">Enter the Secret Code</h2>
    <input type="password" id="code" placeholder="Enter password" />
    <br />
    <button onclick="checkPassword()">Enter</button>
  </div>

  <div class="container" id="messageSection">
    <h1 id="msg" class="fade">Hello My Pudding, do you want me to come over your home after work?</h1>
    <button id="yesBtn" class="fade" onclick="showSurprise()">Yes</button>
    <p id="noMsg" class="fade note">
      What are you looking for... Just click Yes!!!<br>
      <img class="gif" src="https://media.tenor.com/1gkM9PbXG3gAAAAC/orange-cat-cat-hitting-cat.gif" alt="Cat hitting another cat" />
    </p>
  </div>

  <div class="surprise" id="surprise">
    <h1>I knew you would say yes 💖<br>I knew you missed me already</h1>
    <img class="gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cat hugging and kissing" />
    <button id="countdownBtn" onclick="location.href='countdown.html'">See Countdown</button>
  </div>

      const floatingBg = document.getElementById('floatingBg');
      const symbols = ['⭐', '💖'];
      for (let i = 0; i < 20; i++) {
        const span = document.createElement('span');
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.top = Math.random() * 100 + 'vh';
        span.style.animationDuration = (Math.random() * 2 + 4) + 's';
        floatingBg.appendChild(span);
      }
    }

      } else {
        alert("Oops! That's not the right code.");
      }
    }
