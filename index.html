<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Pudding</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@500&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to top right, #fff0f5, #ffe4e1);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .entry, .container, .surprise {
      text-align: center;
      position: absolute;
    }

    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ffc0cb;
      border-radius: 5px;
    }

    button {
      margin-top: 10px;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      font-family: 'Cherry Bomb One', cursive;
    }

    h1, h2, p {
      color: #8b0000;
    }

    .emoji {
      position: absolute;
      font-size: 26px;
      animation: fall 8s linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .flowers {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .container {
      display: none;
      width: 90%;
      max-width: 600px;
    }

    .surprise {
      display: none;
      background: linear-gradient(to top right, #fff0f5, #ffe4e1);
      width: 100vw;
      height: 100vh;
      z-index: 999;
      text-align: center;
      padding-top: 20vh;
    }

    .dancer {
      width: 160px;
      margin-top: 30px;
      border-radius: 20px;
    }

    .envelope {
      background: #fff;
      padding: 20px;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      animation: popin 1.2s ease-out;
    }

    @keyframes popin {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .cute-note {
      font-size: 14px;
      color: #d63384;
      margin-top: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="entry">
    <h2>Enter the Secret Code</h2>
    <input type="password" id="code" placeholder="Enter password" />
    <br />
    <button onclick="checkPassword()">Enter</button>
  </div>

  <div class="container" id="message">
    <div class="envelope">
      <h1 style="font-family: 'Cherry Bomb One', cursive; font-size: 24px;">
        Hello my Pudding, would you like to go for a date with me after your work?
      </h1>
      <button onclick="showSurprise()">Yes</button>
      <p class="cute-note">What are you looking for? There is no "No" option here!!!</p>
    </div>
  </div>

  <div class="surprise" id="surprise">
    <h1 style="font-family: 'Cherry Bomb One', cursive; color: #d63384;">
      I knew you would say yes 💖
    </h1>
    <img class="dancer" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="Dancing Cat" />
  </div>

  <div class="flowers" id="flowers"></div>

  <script>
    function checkPassword() {
      const input = document.getElementById('code').value;
      if (input === '1014') {
        document.querySelector('.entry').style.display = 'none';
        document.getElementById('message').style.display = 'block';
        generateFlowers();
      } else {
        alert("Oops! That's not the right code.");
      }
    }

    function generateFlowers() {
      const container = document.getElementById('flowers');
      const emojis = ['💕', '🌸'];
      for (let i = 0; i < 30; i++) {
        const emoji = document.createElement('div');
        emoji.classList.add('emoji');
        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.left = Math.random() * 100 + 'vw';
        emoji.style.animationDelay = Math.random() * 8 + 's';
        container.appendChild(emoji);
      }
    }

    function showSurprise() {
      document.getElementById('message').style.display = 'none';
      document.getElementById('surprise').style.display = 'block';
      generateFlowers();
    }
  </script>
</body>
</html>
